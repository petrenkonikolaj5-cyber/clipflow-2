
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipFlow 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#111}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#ff245b}
.feed{height:calc(100dvh - 120px);overflow-y:auto;scroll-snap-type:y mandatory}
.video-card{height:100%;position:relative;scroll-snap-align:start;background:#151515;display:flex;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:black}
.info{position:absolute;bottom:25px;left:15px;right:85px;text-shadow:0 2px 5px black}
.actions{position:absolute;right:15px;bottom:45px;display:grid;gap:18px}
.actions button{border:0;background:#252525bb;color:white;border-radius:30px;padding:12px;font-size:22px;cursor:pointer}
nav{height:65px;display:flex;justify-content:space-around;align-items:center;background:#111}
nav button{background:none;border:0;color:white;font-size:15px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:5;align-items:center;justify-content:center;padding:20px}
.panel{background:#222;padding:25px;border-radius:16px;width:min(400px,100%)}
.panel input{width:100%;padding:13px;margin:8px 0;background:#111;color:white;border:1px solid #555;border-radius:8px}
.panel button{padding:12px;margin:5px;border:0;border-radius:8px;cursor:pointer}
.like-button {
  position: absolute;
  right: 16px;
  bottom: 150px;
  z-index: 10;
  width: 64px;
  height: 64px;
  border: none;
  border-radius: 50%;
  background: rgba(20, 20, 20, 0.75);
  color: white;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.like-button:active {
  transform: scale(1.12);
}
</style>
</head>
<body>
<header>
<div class="logo">Clip<span>Flow</span> 2.0</div>
<div>🔍 Поиск</div>
</header>

<main class="feed" id="feed">
<section class="video-card">
<video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" loop playsinline controls></video>
<div class="info">
<h3>@clipflow</h3>
<p>Добро пожаловать в ClipFlow 2.0! 🎬</p>
</div>
<div class="actions">
<button onclick="like(this)">🤍<small> 0</small></button>
<button onclick="comments()">💬</button>
<button onclick="share()">↗️</button>
</div>
</section>
</main>

<nav>
<button onclick="home()">🏠 Лента</button>
<button onclick="openModal('profile')">👤 Профиль</button>
<button onclick="upload()">➕ Видео</button>
<button onclick="openModal('login')">🔐 Войти</button>
</nav>

<div class="modal" id="modal">
<div class="panel" id="panel"></div>
</div>

<script>
 
const API = "https://clipflow-2.onrender.com";

async function register() {
  const username = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;

  try {
    const res = await fetch(API + "/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(data.error || "Ошибка регистрации");
    }

    alert("Аккаунт создан! Теперь войдите.");
    openModal("login");
  } catch (error) {
    alert("Не удалось связаться с сервером");
  }
}

async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  try {
    const res = await fetch(API + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(data.error || "Ошибка входа");
    }

    sessionStorage.setItem("clipflow_token", data.token);
    sessionStorage.setItem("clipflow_user", JSON.stringify(data.user));

    alert("Добро пожаловать, " + data.user.username + "!");
    closeModal();
  } catch (error) {
    alert("Не удалось связаться с сервером");
  }
}

let likes=0;
function like(btn){
 likes++;
 btn.innerHTML='❤️ <small>'+likes+'</small>';
}
function closeModal(){
 document.getElementById('modal').style.display='none';
}
function openModal(type){
 const panel=document.getElementById('panel');
 
if(type==='login'){
 panel.innerHTML=`<h2>Вход</h2>
 <input id="loginEmail" placeholder="Email" type="email">
 <input id="loginPassword" placeholder="Пароль" type="password">
 <button onclick="login()">Войти</button>
 <button onclick="openModal('register')">Регистрация</button>
 <button onclick="closeModal()">Закрыть</button>`;
}else if(type==='register'){
 panel.innerHTML=`<h2>Регистрация</h2>
 <input id="regName" placeholder="Никнейм">
 <input id="regEmail" placeholder="Email" type="email">
 <input id="regPassword" placeholder="Пароль (минимум 8 символов)" type="password">
 <button onclick="register()">Создать аккаунт</button>
 <button onclick="openModal('login')">Назад</button>`;

 }else{
 panel.innerHTML=`<h2>Профиль</h2>
 <p id="profileName">Загрузка профиля...</p>
<button onclick="closeModal()">Закрыть</button>`;
const user = JSON.parse(sessionStorage.getItem('clipflow_user') || 'null');
document.getElementById('profileName').textContent =
  user ? '👤 Никнейм: ' + user.username : 'Войдите в аккаунт';
 }
 document.getElementById('modal').style.display='flex';
}
function upload(){
 const panel=document.getElementById('panel');
 panel.innerHTML=`<h2>Добавить видео</h2>
 <input type="file" accept="video/*" id="file">
 <button onclick="addVideo()">Показать в ленте</button>
 <button onclick="closeModal()">Закрыть</button>`;
 document.getElementById('modal').style.display='flex';
}

async function addVideo(){
  const file = document.getElementById('file').files[0];
  if (!file) return alert('Выберите видео');

  const token = sessionStorage.getItem('clipflow_token');
  if (!token) return alert('Сначала войдите в аккаунт');

  if (file.size > 50 * 1024 * 1024) {
    return alert('Видео должно быть меньше 50 МБ');
  }

  try {
    const response = await fetch('/api/videos/upload', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': file.type
      },
      body: file
    });

    const result = await response.json();
    if (!response.ok) {
      throw new Error(result.error || 'Ошибка загрузки');
    }

    const card = document.createElement('section');
    card.className = 'video-card';

    const video = document.createElement('video');
    video.src = result.url;
    video.controls = true;
    video.loop = true;
    video.playsInline = true;
    card.appendChild(video);

    const info = document.createElement('div');
    info.className = 'info';
    info.textContent = '@you — Моё видео';
    card.appendChild(info);

    document.getElementById('feed').prepend(card);
    closeModal();
    card.scrollIntoView();

    alert('Видео сохранено в Supabase!');
  } catch (error) {
    alert('Ошибка: ' + error.message);
  }
}

function comments(){
 alert('Комментарии добавим позже');
}
function share(){
 if(navigator.share){
 navigator.share({url:location.href}).catch(()=>{});
 }else{
 navigator.clipboard.writeText(location.href)
 .then(()=>alert('Ссылка скопирована'))
 .catch(()=>alert(location.href));
 }
}
function home(){
 document.getElementById('feed').scrollTop=0;
}
const videoObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const video = entry.target;

    if (!entry.isIntersecting || entry.intersectionRatio < 0.6) {
      video.pause();
    } else {
      document.querySelectorAll('#feed video').forEach(other => {
        if (other !== video) other.pause();
      });
      video.play().catch(() => {});
    }
  });
}, { threshold: [0, 0.6, 1] });

function watchVideos() {
  document.querySelectorAll('#feed video').forEach(video => {
    videoObserver.observe(video);
  });
}

watchVideos();
 async function loadSavedVideos() {
  try {
    const response = await fetch('/api/videos');
    if (!response.ok) throw new Error('Ошибка получения видео');

    const videos = await response.json();
    const feed = document.getElementById('feed');

   const token = sessionStorage.getItem('clipflow_token');

const likesResponse = await fetch('/api/videos/likes', {
  headers: token ? { 'Authorization': 'Bearer ' + token } : {}
});

const likesData = likesResponse.ok ? await likesResponse.json() : {};
    for (const item of videos) {
      if (!item.url) continue;

      const card = document.createElement('section');
      card.className = 'video-card';

      const video = document.createElement('video');
      video.src = item.url;
      video.controls = true;
      video.loop = true;
      video.playsInline = true;
      card.appendChild(video);

      const info = document.createElement('div');
      info.className = 'info';
      info.textContent = '@you — Видео';
      card.appendChild(info);

     const likeButton = document.createElement('button');
likeButton.textContent = '🤍 0';
likeButton.className = 'like-button';

const videoPath = new URL(item.url).pathname.split('/videos/')[1];

const likeInfo = likesData[videoPath] || { count: 0, liked: false };

likeButton.textContent =
  (likeInfo.liked ? '❤️ ' : '🤍 ') + likeInfo.count;     
likeButton.onclick = async () => {
  const token = sessionStorage.getItem('clipflow_token');

  if (!token) {
    alert('Сначала войдите в аккаунт');
    return;
  }

  try {
    const response = await fetch('/api/videos/like', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ videoPath })
    });

    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Ошибка лайка');

    if (!likeInfo.liked) {
  likeInfo.count++;
  likeInfo.liked = true;
}

likeButton.textContent = '❤️ ' + likeInfo.count;
  } catch (error) {
    alert(error.message);
  }
};

card.appendChild(likeButton);
      feed.appendChild(card);
    }
  } catch (error) {
    console.error('Не удалось загрузить ленту:', error);
  }
}

loadSavedVideos();

new MutationObserver(watchVideos).observe(
  document.getElementById('feed'),
  { childList: true, subtree: true }
); 
</script>
</body>
</html>
